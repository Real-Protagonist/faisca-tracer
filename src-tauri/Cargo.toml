[package]
name = "faisca-tracer"
version = "1.0.0"
description = "Faísca Tracer — simulador didáctico de instalações eléctricas"
edition = "2021"

[lib]
name = "faisca_tracer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
